name: CD Despliegue VPS

on:
  # Permite que backend y frontend disparen este despliegue automáticamente
  repository_dispatch:
    types: [deploy-service]
  # Permite desplegar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:
    inputs:
      service:
        description: 'Servicio a desplegar (api o frontend)'
        required: true
        type: choice
        options:
          - api
          - frontend
      tag:
        description: 'Tag de la imagen (commit SHA)'
        required: true
        type: string

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue por SSH en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull origin main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh "${{ github.event.client_payload.service || inputs.service }}" "${{ github.event.client_payload.tag || inputs.tag }}"
