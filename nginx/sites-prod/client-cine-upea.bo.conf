# Gateway de producción: un solo dominio (frontend + API bajo /api/)
# DNS: A record client-cine-upea.bo → IP pública del VPS
# Oracle Cloud: abrir puerto 80 en Security List / NSG e iptables/firewalld

upstream api_upstream {
    server api-cine-prod:3000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend-cine-prod:8080;
    keepalive 8;
}

server {
    listen 80 default_server;
    server_name client-cine-upea.bo;

    client_max_body_size 20m;

    # API Nest (global prefix api/v1) — el frontend llama a /api/v1/...
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_upstream/api/;
    }

    location /estatico/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://api_upstream/estatico/;
    }

    location /documentacion {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://api_upstream/documentacion;
    }

    location /documentacion-json {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://api_upstream/documentacion-json;
    }

    # SPA (React) — nginx-unprivileged en :8080
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend_upstream;
    }
}
