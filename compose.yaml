services:
  postgres-cine-prod:
    build:
      context: ./postgres-prod
    image: img-postgres-cine-prod:1.0.0
    container_name: postgres-cine-prod
    ports:
      - "127.0.0.1:5143:5432"
    restart: unless-stopped
    volumes:
      - ./postgres-prod/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - db-network-cine-prod

  api-cine-prod:
    image: ${DOCKER_USERNAME}/api-cine:${API_TAG}
    container_name: api-cine-prod
    env_file:
      - ./env/api.env
    restart: unless-stopped
    volumes:
      - ./data/estatico:/app/estatico
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/documentacion-json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      postgres-cine-prod:
        condition: service_healthy
    networks:
      - db-network-cine-prod

  frontend-cine-prod:
    image: ${DOCKER_USERNAME}/frontend-cine:${FRONTEND_TAG}
    container_name: frontend-cine-prod
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    networks:
      - db-network-cine-prod

  nginx-cine-prod:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: img-nginx-cine-prod:1.0.0
    container_name: nginx-cine-prod
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      api-cine-prod:
        condition: service_healthy
      frontend-cine-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - db-network-cine-prod

networks:
  db-network-cine-prod:
    driver: bridge
    name: db-network-cine-prod
